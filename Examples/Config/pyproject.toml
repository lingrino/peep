[project]
name = "example-tool"
version = "0.9.0"
description = "A command-line example"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "rich"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
example = "example_tool.cli:main"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
timeout = 30.5
started = 2026-01-15T09:30:00Z
