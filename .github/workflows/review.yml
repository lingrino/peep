name: review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: review
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          use_sticky_comment: true
          allowed_bots: renovate[bot]
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read AGENTS.md first: it is the maintainer guide and explains Peep's measured,
            deliberate design (latency first, no caches, no dependencies, SIMD in plain
            Swift, a Quick Look extension plus a keyboard agent). Then review this pull
            request for:
            - Potential bugs or issues (release builds disable exclusivity checks; hot loops
              use unsafe pointers and padded buffers)
            - Hostile input: the extension previews untrusted files, so parsers, lexers and
              readers must stay linear, bounded and crash-free (AGENTS.md, Performance rules)
            - Performance on the first-paint, scroll and search paths
            - Security and privacy: the agent's trust in the extension (links, remote fetches,
              XPC peers), the sandbox, and no real personal data in tests, docs or messages
            - Code quality, consistency with AGENTS.md's rules, and test coverage

            Be concise. Assume the author is familiar with the code and does not need
            lengthy explanations. Do not summarize the code or your thought process,
            just provide the review. Focus on what you think should be changed or improved.
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
